name: Independent kernel replay

# Slower, independent checks of the compiled environment, run weekly and on demand:
# - leanchecker replays every declaration of every math0 module through the Lean kernel,
#   which catches environment tampering that the elaborator would not;
# - axiom-audit (leanprover-community) checks that every declaration under `Math0` uses only
#   propext, Classical.choice and Quot.sound, independently of math0's own audit commands.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/kernel-replay.yml

jobs:
  leanchecker:
    name: leanchecker (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-github-cache: false
      - name: Replay this shard's modules through the kernel
        working-directory: lean
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          mods=$(find Math0 -name '*.lean' | sed 's/\.lean$//; s#/#.#g' | sort | awk -v s=${{ matrix.shard }} 'NR % 4 == s')
          echo "$mods" | wc -l
          lake env leanchecker -v $mods
  axiom-audit:
    name: axiom-audit
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-github-cache: false
          axiom-audit: true
